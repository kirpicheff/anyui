<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wails Benchmark</title>
<style>
  body { font-family: sans-serif; margin: 20px; background: #0f172a; color: #f8fafc; }
  .col { display: flex; flex-direction: column; gap: 12px; max-width: 260px; }
  input { padding: 8px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #f8fafc; }
  button { padding: 8px 14px; border-radius: 6px; border: none; background: #3b82f6; color: white; cursor: pointer; }
</style>
</head>
<body>
  <div class="col">
    <div>Hello, Wails!</div>
    <input type="text" placeholder="Enter text" />
    <button id="btn">Clicks: 0</button>
  </div>
  <script>
    let clicks = 0;
    document.getElementById('btn').onclick = function () {
      clicks++;
      this.textContent = 'Clicks: ' + clicks;
    };
  </script>
</body>
</html>
